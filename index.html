<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iCalc">
  <meta name="theme-color" content="#fbf6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121011" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>iCalc</title>
</head>
<body>
  <header class="topbar">
    <h1 id="title">План</h1>
    <button id="topAction" class="top-btn" type="button"></button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button type="button" data-tab="plan">
      <svg viewBox="0 0 24 24"><path d="M9 4h6M9 4a2 2 0 0 0-2 2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-1a2 2 0 0 0-2-2M8 12l2 2 4-4M8 17h8"/></svg>
      <span data-i18n="tab_plan">План</span>
    </button>
    <button type="button" data-tab="recipes">
      <svg viewBox="0 0 24 24"><path d="M5 4h10a4 4 0 0 1 4 4v12H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
      <span data-i18n="tab_recipes">Рецепты</span>
    </button>
    <button type="button" data-tab="ingredients">
      <svg viewBox="0 0 24 24"><path d="M8 3h8v3H8zM7 6h10l1 3v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9zM6 12h12"/></svg>
      <span data-i18n="tab_ingredients">Ингредиенты</span>
    </button>
    <button type="button" data-tab="more">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span data-i18n="tab_more">Ещё</span>
    </button>
  </nav>

  <div id="sheets"></div>
  <div id="toast" role="status"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
